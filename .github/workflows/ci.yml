name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git identity for repository fixtures
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "Branchly CI"
          git config --global init.defaultBranch main

      - name: Install development tools
        run: |
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .

      - name: Run the safety-critical tests first
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest tests.test_git_runner tests.test_git_refname tests.test_git_remote_url -v

      - name: Run the full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
